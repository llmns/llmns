[package]
name = "llmns-py"
description = "Python bindings for llmns (extension module llmns._llmns)"
# Distributed as wheels on PyPI via maturin, never as a crate.
publish = false
version = "0.1.0" # x-release-please-version
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/llmns/llmns"

[lib]
name = "_llmns"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py312"] }
