[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "llmns"
version = "0.3.0"
description = "Parse, normalize, and compare llm:// references (llmns, a name system for language models)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "4thel00z" }]
keywords = ["llm", "uri", "llmns", "model", "reference", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://llmns.info"
Specification = "https://llmns.info/rfc.html"
Repository = "https://github.com/llmns/llmns"
Issues = "https://github.com/llmns/llmns/issues"

[tool.maturin]
python-source = "python"
module-name = "llmns._llmns"
manifest-path = "crates/llmns-py/Cargo.toml"
features = ["pyo3/extension-module"]
# The declared License-Files live at the workspace root, outside the
# manifest dir — include them explicitly or PyPI rejects the sdist (PEP 639).
include = [
    { path = "LICENSE-MIT", format = "sdist" },
    { path = "LICENSE-APACHE", format = "sdist" },
]

[dependency-groups]
dev = ["maturin>=1.7", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
